<!doctype html>
<html lang="en">
	<head>
		<style>
			a {
				text-decoration: none;
			}
		</style>
		<meta charset="UTF-8">
		<title>OTDR Results</title>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
		<!-- <script src="https://socket.io"></script> -->
		<script type="text/javascript" charset="utf-8">		
			// graph data
			var coords = [];
			var minX = 999.9;
			var maxX = 0.0;
			var minY = 999.9;
			var maxY = 0.0;
			var xMaxPos = 200;

			const serverHost = window.location.host; 
			url = "http://" + serverHost
			console.log('Server Host:', url);
			const socket = io(url);

			socket.on('connect', () => {
				console.log('Connected to Raspberry Pi server!');
				//socket.emit('refresh_test_page');
			});
			
			config = JSON.parse({{ data | tojson | safe }});
			
			var launchCableLength = 50
			if (typeof localConfig != 'undefined') 
			{
				localConfig = JSON.parse({{ localData | tojson | safe }});
				if (Object.hasOwn(localConfig, 'launchLength'))
				{
					launchCableLength = localConfig.launchLength;
				}
			}
			
			if (Object.hasOwn(config, 'STP'))
			{
				if(config.STP[0] != "1")		// not auto distance mode
				{
					let xMaxPosMeters = config.STP[1];	// cannot exceed specified distance expressed in meters
					xMaxPos = xMaxPosMeters / 1000;
				}
				else
				{
					xMaxPos = "200";
				}
				console.log("xMaxPos = " + xMaxPos);
			}

			// Listen for device data

			
			socket.on('data_chunk', (msg) => {
				console.log("received a chunk");
				let expandedMinY = document.getElementById('dBMinInput').value;
				let expandedMaxY = document.getElementById('dBMaxInput').value;
				document.getElementById("measurementStatus").value = "Transferring Data";
				msg.points.forEach(point => {				
					//console.log(`Received Point -> x: ${point.x}, y: ${point.y}`);
					x = parseFloat(point.x);
					y = parseFloat(point.y);
					if(x < Number(xMaxPos))
					{
						if(document.getElementById('expanded').checked)
						{
							if(y < expandedMinY)
							{
								y = expandedMinY;
							}
							else if(y > expandedMaxY)
							{
								y = expandedMaxY;	
							}
						}				
						if(x < minX)
						{
							minX = x;
						}
						else if(x > maxX)
						{
							maxX = x;
						}
						if(y < minY)
						{
							minY = y;
						}
						else if(y > maxY)
						{
							maxY = y;
							console.log("new MaxY = " + maxY);
						}
						coords.push([x, y])
					}
				});
				// Append or process point dictionary chunks here
			});
			
			console.log("MinX = " + minX);
			console.log("MaxX = " + maxX);
			console.log("MinY = " + minY);
			console.log("MaxY = " + maxY);

			socket.on('data_complete', () => {
				stopBlinkTimer();
				document.getElementById("measurementStatus").value = "Rendering Waveform";
				document.getElementById("fullRange").hidden = false;
				document.getElementById("fullRangeLabel").hidden = false;
				document.getElementById("expanded").hidden = false;
				document.getElementById("expandedLabel").hidden = false;


				//for(let i=0; i<coords.length; i++)
				//{
				//	console.log(coords[i]);
				//}
				console.log("minX = %f, maxX = %f, minY = %f, maxY = %f", minX, maxX, minY, maxY);
				const canvas = document.getElementById('lineChart');
				const ctx = canvas.getContext('2d');
				let border = 60;
				let innerBorder = 20;	// so graph does not reach axis
				let totalBorder = border + innerBorder;
				ctx.canvas.width = 800 + totalBorder;
				ctx.canvas.height = 450 + totalBorder;
				ctx.font = '20px monospace';
				

				//outline
				ctx.beginPath();                  					
				ctx.moveTo(border, 0);               					
				ctx.lineTo(ctx.canvas.width, 0);              	
				ctx.lineTo(ctx.canvas.width , ctx.canvas.height - border); 	
				ctx.lineTo(border, ctx.canvas.height - border);
				ctx.closePath();               	// Link back to the start point

				ctx.lineWidth = 2;           	// Adjust outline thickness
				ctx.strokeStyle = 'green';   	// Set outline color
				ctx.stroke();  
				
				ctx.fillStyle = 'red';
				
				// vertical hash marks
				let vBottom = ctx.canvas.height - totalBorder;
				let vTop = innerBorder;	
				let vHash = 6;
				let vStep = (vBottom - vTop) / vHash;		// counting up from bottom				
				let vVal = (maxY-minY)/vHash;
				console.log("maxY = " + maxY + " minY = " + minY + " vHash = " + vHash + " vVal = " + vVal);
				// console.log("vBottom = " + vBottom);				
				// console.log("vTop = " + vTop);
				// console.log("vVal = " + vVal);
				for(let i = 0; i < vHash+1; i++)
				{
					ctx.beginPath();
					ctx.moveTo(border * .75, vBottom - (vStep * i));
					ctx.lineTo(border, vBottom - (vStep * i));
					ctx.closePath();
					ctx.lineWidth = 1;           	  	
					ctx.stroke();	
					
					let fVal = Number((vVal * i));
					fVal += Number(minY);
					let vFloat = parseFloat(fVal); // no leading zeros for toFixed
					let vDisplay = vFloat.toFixed(1)
					let vString = vDisplay.toString().padStart(1, '0');
				
					ctx.fillText(vString, 0, vBottom - (vStep * i) + 9);
				}	
				
				ctx.fillText("dB", 0, ctx.canvas.height - 20);
				ctx.fillText("(Atten)", 0, ctx.canvas.height);

				
				// horizontal hash marks
				let hRight = ctx.canvas.width - innerBorder;
				let hLeft = totalBorder;
				let hHash = 6;
				let hStep = (hRight - hLeft) / hHash;
				let hVal = maxX/hHash;
				// console.log("hStep = " + hStep);				
				// console.log("hLeft = " + hLeft);				
				// console.log("hRight = " + hRight);				
				// console.log("hVal = " + hVal);
				for(let i = 0; i < hHash+1; i++)
				{
					ctx.beginPath();
					ctx.moveTo(hLeft + (hStep * i), ctx.canvas.height - border);
					ctx.lineTo(hLeft + (hStep * i), ctx.canvas.height - border * .60);
					ctx.closePath();
					ctx.lineWidth = 1;           	
					ctx.stroke(); 
					
					hFloat = hVal * i;
					hFloat = parseFloat(hFloat);		// no leading zeros for toFixed
					hDisplay = hFloat.toFixed(1)
					let hString = hDisplay.toString().padStart(1, '0');
					//ctx.fillText(hString, hLeft + (hStep * i) - 15, ctx.canvas.height - 20);
					ctx.fillText(hString, hLeft + (hStep * i) - 23, ctx.canvas.height - 20);
				}
				
				ctx.fillText("kM (Distance)", ctx.canvas.width/2, ctx.canvas.height);
				
				// graph
				let startX = hLeft;
				let startY = vBottom;
				ctx.lineWidth = 1;             	// Adjust outline thickness
				ctx.strokeStyle = 'black';    	// Set outline color
				for(let i = 0; i < coords.length; i++)
				{
					ctx.beginPath();
					ctx.moveTo(startX, startY);
					let xCoord = Math.trunc(((coords[i][0] - minX) / maxX) * ((ctx.canvas.width - (totalBorder + innerBorder))));
					let yCoord = Math.trunc(ctx.canvas.height - ((coords[i][1] - minY) / maxY) * (ctx.canvas.height - (totalBorder + innerBorder)));		// inverted
					//console.log("ctx.canvas.height - ((coords[i][1] - minY) / maxY ", ctx.canvas.height - ((coords[i][1] - minY) / maxY));
					//console.log("yCoord = ", yCoord);
					//console.log("coords[i][1] = ", coords[i][1]);
					startX = xCoord + totalBorder;
					startY = yCoord - totalBorder;
					if(coords[i][0] > (launchCableLength/1000))				// dead zone .05 kilometers or 50 meters
					{
						ctx.lineTo(startX, startY);
						ctx.stroke();
					}
				}		
				coords.length = 0;
			});
			
			const selectElement = document.getElementById("results");
			const items = ["Apple", "Banana", "Cherry"];
			
			selectElement.innerHTML = ""; 
			selectElement.options.length = 1; 

			items.forEach(item => {
				selectElement.add = item.toLowerCase();
			}
});
					
    					
		</script>
	</head>
	<body style="font-family: sans-serif; padding: 20px;">
		<h2>Results</h2>	
		<div class="chart-container">
			<canvas id="lineChart" width="600" height="450"></canvas>
		</div>
		
		<h3>Select</h3>
		<br>
		<br>
		<label for="results">Choose Result</label>
		<select name="results" id="results">
			<option value="result1">Result1</option>
			<option value="result2">Result2</option>
			<option value="result3">Result3</option>
			<option value="result4">Result4</option>		
			<option value="result5">Result5</option>
			<option value="result6">Result6</option>
			<option value="result7">Result7</option>
			<option value="result8">Result8</option>		
			<option value="result9">Result9</option>
			<option value="result10">Result10</option>			</select>
		<h3> </h3>

		<a href="{{ url_for('gotoDashboard') }}">
			<button type="button">Main Menu</button>
		</a>
		<a href="{{ url_for('gotoSetup') }}">
			<button type="button">Setup Page</button>
		</a>	
	</body>
</html>
