<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>OTDR Admin</title>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
	</head>
	<body style="font-family: sans-serif; padding: 20px;">
		<h2>Admin</h2>		
		<h3>Ethernet Connection Time</h3>
		<input type="range" id="connectionTimeRange" min="1" max="7200" value="3600" class="slider" oninput="updateConnectionTime(this.value)" >
		<input type="text" id="connectionTimeInput" oninput="updateConnectionTimeSlider(this.value)" placeholder="5000" style="width: 120px"; >
		<br>
		<h3>Wavelength</h3>
		<label for="wavelength-select">Wavelength:</label>
		<select id="wavelength-select">
			<option value="850">850 nm</option>
			<option value="1310">1310 nm</option>
			<option value="1550">1550 nm</option>
		</select>
		<br>
		<h3>Launch Cable Length</h3>
		<input type="range" id="launchCableLengthRange" min="0" max="500" value="50" class="slider" oninput="updateLaunchCableLength(this.value)" >
		<input type="text" id="launchCableLengthInput" oninput="updateLaunchCableLengthSlider(this.value)" placeholder="50" style="width: 120px"; >
		<br>
		<h3>Firmware Update</h3>
		<label for="softwareVersion">Installed Version: </label>
		<input type="text" id="softwareVersion" placeholder="0.0.0" style="width: 60px"; readonly>
		<br>
		<br>
		<form action="/upload" method="POST" enctype="multipart/form-data">			
			<input type="file" id="firmware-upload" name="firmware-upload" accept=".gfb" required>
			<br>
			<br>
			<button id=firmwareUpload type="submit">Upload</button>
		</form>
		<br>
		<h3>OTDR Update</h3>
		<input type="radio" id="OTDRMode" name="mode" value="otdr" onclick=toggleOtdrMode() checked />
		<label for="OTDRMode">OTDR Mode</label>
		<input type="radio" id="UploadMode" name="mode" value="upload" onclick=toggleOtdrMode()  />
		<label for="UploadMode">Upload Mode</label>
		<br>
		<br>
		<form>
			<input type="file" id="otdr-upload" name="otdr-upload">
			<br>
			<br>
			<button id=otdrUpload onclick="uploadOTDRFirmware)">Upload</button>
		</form>
		<h3> </h3>
		<button onclick="updateConfig(); updateLocalConfig();">Set Parameters</button>
		<br>
		<br>
		<a href="{{ url_for('gotoDashboard') }}">
			<button type="button">Main Menu</button>
		</a>
		<script type="text/javascript" charset="utf-8">
		
			const serverHost = window.location.host; 
			url = "http://" + serverHost
			console.log('Server Host:', url);
			const socket = io(url);

			socket.on('connect', () => {
				console.log('Connected to Raspberry Pi server!');
			});
					
			var config = JSON.parse({{ data | tojson | safe }});
			var localConfig = JSON.parse({{ localData | tojson | safe }});
			var softwareVersion = JSON.parse({{ versionData | tojson | safe }});
			
			// screen controls init
			//console.log(config);
			//CONNTM
			if (Object.hasOwn(config, 'CONNTM'))
			{
				document.getElementById('connectionTimeInput').value = config.CONNTM[0];
				updateConnectionTimeSlider(config.CONNTM[0]);
			}
			//WLS
			if (Object.hasOwn(config, 'WLS'))
			{			
				document.getElementById('wavelength-select').value = config.WLS[0];
			}
			//DLMODE
			if (Object.hasOwn(config, 'DLMODE'))
			{			
				document.getElementById('UploadMode').checked = (config.DLMODE[0] != 0);
				toggleOtdrMode();
			}
			if (Object.hasOwn(localConfig, 'launchLength'))
			{
				document.getElementById('launchCableLengthInput').value = localConfig.launchLength;
				updateLaunchCableLengthSlider(localConfig.launchLength);
			}
			if (Object.hasOwn(softwareVersion, 'version'))
			{
				console.log("version");
				document.getElementById('softwareVersion').value = softwareVersion.version;
			}			
			// end screen controls init
			
			var next = true;
			
			const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
			
			socket.on('response_data', function(response) {
				console.log(response.payload);
				next = true;
			})

			socket.on('response_local_data', function(localResponse) {
				console.log(localResponse.payload);
			})
						
			function isNumber(value) {
				return !isNaN(value) && !isNaN(parseFloat(value));
			}
			
			function updateConnectionTime(val) {
				document.getElementById('connectionTimeInput').value = val;
			}

			function updateConnectionTimeSlider(val) {
				console.log("updateConnectionTimeSlider");
				if(isNumber(val) && (val > 0) && (val < 7201))
					document.getElementById('connectionTimeRange').value = val;
			}
			
			function updateLaunchCableLength(val) {
				document.getElementById('launchCableLengthInput').value = val;
			}

			function updateLaunchCableLengthSlider(val) {
				console.log("updateConnectionTimeSlider");
				if(isNumber(val) && (val > 0) && (val < 501))
					document.getElementById('launchCableLengthRange').value = val;
			}
			
			function  getSoftwareVersion()
			{
				socket.emit('getVersion');
			}
			
			function toggleOtdrMode() {
				val1 = 0;
				if(document.getElementById('UploadMode').checked)
					val1 = 1;
				if(val1 != 1)
				{
					document.getElementById('otdr-upload').style.visibility = "hidden";
					document.getElementById('otdrUpload').style.visibility = "hidden";
				}
				else
				{
					document.getElementById('otdr-upload').style.visibility = "visible";
					document.getElementById('otdrUpload').style.visibility = "visible";
				}	
				socket.emit('otdr_mode', {cmd: 'DLMODE', arg1: val1});
			}
			
			async function updateConfig() {
				for(let i = 0; i<3; i++)
				{
					console.log(i);
					let val1 = '';
					let val2 = '';
					let val3 = '';
					let val4 = '';
					let val5 = '';
					let val6 = '';
					switch(i)
					{
						case 0:
							val1 = document.getElementById('connectionTimeInput').value;
							socket.emit('update_json', {cmd: 'CONNTM', arg1: val1, arg2: val2, arg3: val3, arg4: val4, arg5: val5, arg6: val6});
							next = false;
							break;
						case 1:				
							val1 = document.getElementById('wavelength-select').value;
							socket.emit('update_json', {cmd: 'WLS', arg1: val1, arg2: val2, arg3: val3, arg4: val4, arg5: val5, arg6: val6});
							next = false;
							break;				
						case 2:				
							val1 = (document.getElementById('UploadMode').checked == true);
							socket.emit('update_json', {cmd: 'DLMODE', arg1: val1, arg2: val2, arg3: val3, arg4: val4, arg5: val5, arg6: val6});
							next = false;
							break;					}
					while(!next)
						await sleep(5)	// 5msec
				}
				socket.emit('update_OTDR', {cmd: 'UPDATE'});
			}
			
			async function updateLocalConfig() {
				console.log("updateLocalConfig called");
				val = document.getElementById('launchCableLengthInput').value;
				socket.emit('update_local_json', {cmd: 'launchLength', arg: val});
			}
		</script>
	</body>
